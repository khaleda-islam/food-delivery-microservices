version: '3.8'

services:
  # Eureka Discovery Server
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - food-delivery-network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8761 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # API Gateway Service
  api-gateway:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8082:8082"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_APPLICATION_NAME=Api-Gateway-Service
    networks:
      - food-delivery-network
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  # Food Delivery Service
  food-delivery-service:
    build:
      context: ./food-delivery-service
      dockerfile: Dockerfile
    container_name: food-delivery-service
    ports:
      - "8083:8083"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_APPLICATION_NAME=food-delivery-service
    networks:
      - food-delivery-network
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure

  # React Frontend
  react-frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "3000:3000"
    networks:
      - food-delivery-network
    depends_on:
      - api-gateway
    restart: on-failure

networks:
  food-delivery-network:
    driver: bridge
