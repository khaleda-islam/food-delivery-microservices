
server.port=8083

# Discovery Server Access
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
# Service registers under this name
spring.application.name=food-delivery-service

# Eureka Instance Configuration - Use IP/localhost instead of hostname
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.main.web-application-type=reactive

# Exclude sync MongoDB auto-configuration (we only use reactive)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
logging.level.org.springframework=ERROR
logging.level.com=TRACE

# MongoDB Atlas Configuration (Reactive)
spring.data.mongodb.uri=mongodb+srv://adminUser:Canada%402023@fds-cluster.s1pt4r2.mongodb.net/foodDeliveryDB?retryWrites=true&w=majority
spring.data.mongodb.database=foodDeliveryDB

# Additional MongoDB Configuration
spring.data.mongodb.auto-index-creation=true
logging.level.org.mongodb=DEBUG

